# fly.toml app configuration file generated for threadii-app on 2026-08-17T15:45:43-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'threadii-app'
primary_region = 'ord'

[build]
[env]
  DB_PATH = '/data/closet.db'
  UPLOADS_DIR = '/data/uploads'

[[mounts]]
  source = 'threadii_data'
  destination = '/data'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
